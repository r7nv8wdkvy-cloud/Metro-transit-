<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Metro Transit">
<meta name="theme-color" content="#fafafa">
<title>Metro Transit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:#101010;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.app{width:100%;height:100%;min-height:100svh;background:#fafafa;color:#303236;overflow:auto;position:relative}
.close-btn{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:28px;width:38px;height:38px;border:0;background:transparent;color:#1596df;font-size:44px;line-height:34px;font-weight:300;padding:0;z-index:10}
.content{padding:clamp(78px,11vh,112px) 30px 40px}
.title{font-size:29px;line-height:1.05;font-weight:750;margin:0}
.subtitle{font-size:21px;margin-top:2px}

/* The reference video shows the Go-To logo repeatedly shrinking slightly,
   then returning to full size. This reproduces that breathing/pulsing motion. */
.logo-wrap{
  width:min(225px,54vw);
  height:min(225px,54vw);
  margin:clamp(55px,8vh,82px) auto clamp(55px,10vh,102px);
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo{
  width:100%;height:100%;object-fit:cover;border-radius:50%;
  transform:scale(1);
  animation:logoPulse 3.0s ease-in-out infinite;
  transform-origin:center;
  will-change:transform;
}
@keyframes logoPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(.925)}
}
@media (prefers-reduced-motion: reduce){
  .logo{animation:none}
}

.clock{font-size:clamp(48px,12.9vw,66px);letter-spacing:-2.5px;font-weight:800;line-height:1;text-align:center;white-space:nowrap;margin-bottom:23px}
.card{background:#fff;border:1px solid #dedede;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.25);padding:19px 22px 28px}
.type{font-size:27px;line-height:1.15;margin-bottom:5px}.area{font-size:17px;color:#555;margin-bottom:43px}.expires{font-size:20px;font-weight:750}
@media (max-height:700px){.content{padding-top:45px}.logo-wrap{margin-top:35px;margin-bottom:45px}}
</style>
<!-- BOTTOM LIVE DATE VERSION -->

<style id="ticket-nav-styles">
#ticketsPage{display:none;min-height:100vh;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#ticketsPage .tickets-header{height:86px;border-bottom:1px solid #242424;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box}
#ticketsPage .menu-icon,#ticketsPage .refresh-icon{color:#129bd1;font-size:42px;line-height:1;width:52px;text-align:center}
#ticketsPage .tickets-title{font-size:36px;font-weight:600}
#ticketsPage .activated{color:#129bd1;font-size:40px;font-weight:700;margin:66px 44px 70px}
#ticketsPage .ticket-list-card{margin:0 34px;border-radius:17px;background:#050505;box-shadow:0 0 35px rgba(255,255,255,.08);padding:22px 20px;display:flex;align-items:stretch;min-height:330px;box-sizing:border-box}
#ticketsPage .mini-logo-wrap{width:125px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;box-sizing:border-box}
#ticketsPage .mini-logo{width:105px;height:105px;object-fit:contain}
#ticketsPage .ticket-panel{background:#373737;flex:1;padding:36px 36px 30px;box-sizing:border-box}
#ticketsPage .ticket-type{font-size:35px;font-weight:700;margin-bottom:76px}
#ticketsPage .view-ticket{width:100%;height:142px;border:3px solid #129bd1;border-radius:22px;overflow:hidden;display:flex;background:#000;color:#fff;cursor:pointer;padding:0}
#ticketsPage .view-ticket-main{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;font-size:31px;line-height:1.05}
#ticketsPage .ticket-symbol{font-size:42px}
#ticketsPage .time-left{width:188px;background:#129bd1;color:#000;display:flex;align-items:center;justify-content:center;text-align:center;font-size:27px;line-height:1.25}
#ticketsPage .buy-tickets{position:fixed;left:43px;right:43px;bottom:88px;height:96px;border:0;border-radius:22px;background:#129bd1;color:#000;font-size:31px;cursor:pointer}
#ticketsPage button{font-family:inherit}
@media(max-width:600px){
#ticketsPage .tickets-header{height:76px;padding:0 20px}
#ticketsPage .tickets-title{font-size:30px}
#ticketsPage .activated{font-size:34px;margin:55px 32px 58px}
#ticketsPage .ticket-list-card{margin:0 26px;min-height:290px;padding:18px 12px}
#ticketsPage .mini-logo-wrap{width:90px}
#ticketsPage .mini-logo{width:76px;height:76px}
#ticketsPage .ticket-panel{padding:28px 20px 22px}
#ticketsPage .ticket-type{font-size:27px;margin-bottom:54px}
#ticketsPage .view-ticket{height:110px}
#ticketsPage .view-ticket-main{font-size:24px;gap:14px}
#ticketsPage .time-left{width:125px;font-size:21px}
#ticketsPage .buy-tickets{left:26px;right:26px;bottom:34px;height:76px;font-size:25px}
}
</style>
</head>
<body>
<div class="app">
  <button class="close-btn" aria-label="Close" id="closeBtn">×</button>
  <main class="content">
    <h1 class="title">Metro Transit</h1>
    <div class="subtitle">Show operator your ticket</div>
    <div class="logo-wrap"><img class="logo" src="logo.png" alt="Go-To Metro Transit"></div>
    <div class="clock" id="clock">--:--:-- --</div>
    <section class="card">
      <div class="type">Adult Non-Rush Hour</div>
      <div class="area">Minneapolis/ St. Paul Metro Area</div>
      <div class="expires">Expires <span id="bottomDate">--</span> at 2:22 AM</div>
    </section>
  </main>
</div>
<script>
const CENTRAL_TIME_ZONE = "America/Chicago";

const clockFormatter = new Intl.DateTimeFormat("en-US", {
  timeZone: CENTRAL_TIME_ZONE,
  hour: "numeric",
  minute: "2-digit",
  second: "2-digit",
  hour12: true
});

const shortFormatter = new Intl.DateTimeFormat("en-US", {
  timeZone: CENTRAL_TIME_ZONE,
  hour: "numeric",
  minute: "2-digit",
  hour12: true
});

const dateFormatter = new Intl.DateTimeFormat("en-US", {
  timeZone: CENTRAL_TIME_ZONE,
  month: "long",
  day: "numeric",
  year: "numeric"
});

function updateAllTimeFields() {
  const now = new Date();

  // Large clock
  document.getElementById("clock").textContent = clockFormatter.format(now);

  // BOTTOM expiration line — this is intentionally updated separately.
  document.getElementById("bottomDate").textContent = dateFormatter.format(now);
}

updateAllTimeFields();
setInterval(updateAllTimeFields, 1000);
</script>

<div id="ticketsPage" aria-hidden="true">
  <div class="tickets-header">
    <div class="menu-icon">☰</div>
    <div class="tickets-title">My Tickets</div>
    <div class="refresh-icon">↻</div>
  </div>
  <div class="activated">Activated Tickets</div>
  <div class="ticket-list-card">
    <div class="mini-logo-wrap"><img class="mini-logo" src="logo.png" alt="Go-To"></div>
    <div class="ticket-panel">
      <div class="ticket-type">Adult Non-Rush Hour</div>
      <button class="view-ticket" id="viewTicketBtn" type="button">
        <span class="view-ticket-main"><span>View This<br>Ticket</span><span class="ticket-symbol">🎟</span></span>
        <span class="time-left">TIME<br>LEFT<br>2 hours</span>
      </button>
    </div>
  </div>
  <button class="buy-tickets" type="button">Buy Tickets</button>
</div>


<script id="ticket-nav-script">
(function () {
  const mainScreen = document.querySelector(".app");
  const ticketsPage = document.getElementById("ticketsPage");
  const closeBtn = document.getElementById("closeBtn");
  const viewBtn = document.getElementById("viewTicketBtn");

  function showTickets() {
    mainScreen.style.display = "none";
    ticketsPage.style.display = "block";
    ticketsPage.setAttribute("aria-hidden", "false");
    window.scrollTo(0, 0);
  }

  function showMain() {
    ticketsPage.style.display = "none";
    ticketsPage.setAttribute("aria-hidden", "true");
    mainScreen.style.display = "block";
    window.scrollTo(0, 0);
  }

  closeBtn.addEventListener("click", showTickets);
  viewBtn.addEventListener("click", showMain);
})();
</script>

</body>
</html>
