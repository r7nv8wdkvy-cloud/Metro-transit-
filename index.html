<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Metro Transit">
<meta name="theme-color" content="#101010">
<title>Metro Transit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:#101010;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.app{width:100%;height:100%;min-height:100svh;background:#fafafa;color:#303236;overflow:auto}
.status{height:clamp(100px,14.8vh,135px);padding:calc(env(safe-area-inset-top) + 9px) 39px 0;background:#101010;color:#fff;display:flex;justify-content:space-between;position:relative;font-weight:600;font-size:21px}
.status-left{display:flex;gap:7px;align-items:center}.status-right{display:flex;gap:8px;align-items:center;font-size:17px}
.island{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 4px);transform:translateX(-50%);width:220px;height:47px;border:2px solid #40151d;border-radius:28px;background:#000}
.dot{position:absolute;left:14px;top:14px;width:16px;height:16px;border-radius:50%;background:#ef3b36}
.content{padding:clamp(55px,10vh,98px) 30px 40px}
.title{font-size:29px;line-height:1.05;font-weight:750;margin:0}
.subtitle{font-size:21px;margin-top:2px}

/* The reference video shows the Go-To logo repeatedly shrinking slightly,
   then returning to full size. This reproduces that breathing/pulsing motion. */
.logo-wrap{
  width:min(225px,54vw);
  height:min(225px,54vw);
  margin:clamp(55px,8vh,82px) auto clamp(55px,10vh,102px);
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo{
  width:100%;height:100%;object-fit:cover;border-radius:50%;
  transform:scale(1);
  animation:logoPulse 3.0s ease-in-out infinite;
  transform-origin:center;
  will-change:transform;
}
@keyframes logoPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(.925)}
}
@media (prefers-reduced-motion: reduce){
  .logo{animation:none}
}

.clock{font-size:clamp(48px,12.9vw,66px);letter-spacing:-2.5px;font-weight:800;line-height:1;text-align:center;white-space:nowrap;margin-bottom:23px}
.card{background:#fff;border:1px solid #dedede;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.25);padding:19px 22px 28px}
.type{font-size:27px;line-height:1.15;margin-bottom:5px}.area{font-size:17px;color:#555;margin-bottom:43px}.expires{font-size:20px;font-weight:750}
@media (max-height:700px){.content{padding-top:45px}.logo-wrap{margin-top:35px;margin-bottom:45px}}
</style>
</head>
<body>
<div class="app">
  <div class="status">
    <div class="status-left"><span id="statusClock">--:--</span><span>☾</span></div>
    <div class="island"><div class="dot"></div></div>
    <div class="status-right">▮▮▮ ◔ 55</div>
  </div>
  <main class="content">
    <h1 class="title">Metro Transit</h1>
    <div class="subtitle">Show operator your ticket</div>
    <div class="logo-wrap"><img class="logo" src="logo.png" alt="Go-To Metro Transit"></div>
    <div class="clock" id="clock">--:--:-- --</div>
    <section class="card">
      <div class="type">Adult Non-Rush Hour</div>
      <div class="area">Minneapolis/ St. Paul Metro Area</div>
      <div class="expires">Expires Sep 19, 2026 at 2:22 AM</div>
    </section>
  </main>
</div>
<script>
const tz="America/Chicago";
const full=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true});
const short=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit",hour12:true});
function tick(){const n=new Date();document.querySelector("#clock").textContent=full.format(n);document.querySelector("#statusClock").textContent=short.format(n)}
tick();setInterval(tick,250);
</script>
</body>
</html>
